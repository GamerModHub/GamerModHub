<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Crear Novedad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap');

        :root {
            --neon-green: #00ff94;
            --neon-blue: #00f0ff;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, #0a0c16 0%, #1a1d2e 100%);
            color: #fff;
            min-height: 100vh;
        }

        .font-neon { font-family: 'Orbitron', sans-serif; }

        .form-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .form-box {
            background: rgba(10, 12, 22, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 148, 0.2);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 0 40px rgba(0, 255, 148, 0.1);
        }

        .form-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            color: var(--neon-green);
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(0, 255, 148, 0.4);
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #9ca3af;
            font-size: 14px;
        }

        .form-input, .form-textarea, .form-select {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 255, 148, 0.2);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-input:focus, .form-textarea:focus, .form-select:focus {
            outline: none;
            border-color: var(--neon-green);
            box-shadow: 0 0 20px rgba(0, 255, 148, 0.2);
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: block;
            padding: 40px 20px;
            border: 2px dashed rgba(0, 255, 148, 0.3);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.2);
        }

        .file-input-label:hover {
            border-color: var(--neon-green);
            background: rgba(0, 255, 148, 0.05);
        }

        .file-input-label.has-image {
            border-style: solid;
            border-color: var(--neon-green);
            padding: 10px;
        }

        .preview-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .btn-save {
            background: var(--neon-green);
            color: #000;
            border: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 148, 0.3);
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 255, 148, 0.5);
        }

        .btn-cancel {
            background: transparent;
            color: #9ca3af;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 14px 32px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-left: 12px;
        }

        .btn-cancel:hover {
            border-color: #fff;
            color: #fff;
        }

        .news-list {
            margin-top: 40px;
        }

        .news-item {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 255, 148, 0.1);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            border-color: var(--neon-green);
            transform: translateX(5px);
        }

        .news-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }

        .news-item-info {
            flex: 1;
        }

        .news-item-title {
            font-weight: 700;
            margin-bottom: 4px;
        }

        .news-item-date {
            font-size: 13px;
            color: #6b7280;
        }

        .btn-delete {
            background: rgba(255, 0, 85, 0.2);
            color: #ff0055;
            border: 1px solid rgba(255, 0, 85, 0.3);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-delete:hover {
            background: rgba(255, 0, 85, 0.3);
        }

        .alert {
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: rgba(0, 255, 148, 0.1);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
        }

        .alert-error {
            background: rgba(255, 0, 85, 0.1);
            border: 1px solid #ff0055;
            color: #ff0055;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="form-box">
            <h1 class="form-title">
                <i class="fa fa-plus-circle"></i> Crear Novedad
            </h1>
            <p class="text-gray-400 mb-8">Agrega una nueva novedad al sistema</p>

            <div id="alert" class="alert"></div>

            <form id="newsForm">
                <div class="form-group">
                    <label class="form-label">Título/Badge *</label>
                    <input type="text" id="titulo" class="form-input" placeholder="Ej: NUEVO, ACTUALIZACIÓN, AGREGADO" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Nombre del Juego/Mod *</label>
                    <input type="text" id="nombre" class="form-input" placeholder="Ej: LEEF 4 DEAD 2 (BETA 2.1)" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Descripción *</label>
                    <textarea id="descripcion" class="form-textarea" placeholder="Describe la novedad..." required></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Imagen de fondo *</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="imagen" accept="image/*" required onchange="previewImage(this)">
                        <label for="imagen" class="file-input-label" id="fileLabel">
                            <i class="fa fa-cloud-upload text-4xl mb-2 block"></i>
                            <span>Arrastra una imagen o haz clic para seleccionar</span>
                            <br>
                            <small class="text-gray-500">Formatos: JPG, PNG, WEBP (Max 5MB)</small>
                        </label>
                    </div>
                    <img id="imagePreview" class="preview-image" style="display: none;">
                </div>

                <div class="form-group">
                    <label class="form-label">Enlace de descarga (opcional)</label>
                    <input type="url" id="enlace" class="form-input" placeholder="https://...">
                </div>

                <div class="form-group">
                    <label class="form-label">Texto del botón (opcional)</label>
                    <input type="text" id="boton" class="form-input" placeholder="Ej: OBTENER, DESCARGAR, VER MÁS" value="OBTENER">
                </div>

                <div class="form-group">
                    <label class="form-label">Fecha *</label>
                    <input type="date" id="fecha" class="form-input" required>
                </div>

                <div class="flex flex-wrap gap-4">
                    <button type="submit" class="btn-save">
                        <i class="fa fa-save"></i> Guardar Novedad
                    </button>
                    <button type="button" class="btn-cancel" onclick="window.location.href='index.html'">
                        <i class="fa fa-arrow-left"></i> Volver
                    </button>
                </div>
            </form>

            <!-- Lista de novedades existentes -->
            <div class="news-list" id="newsList">
                <h2 class="font-neon text-xl mb-4 text-cyan-400">Novedades Existentes</h2>
                <div id="newsItems"></div>
            </div>
        </div>
    </div>

    <script>
        let newsData = [];
        let currentImageBase64 = '';

        // Cargar novedades existentes
        async function loadExistingNews() {
            try {
                const response = await fetch('novedades.json');
                if (response.ok) {
                    const data = await response.json();
                    newsData = data.novedades || [];
                    renderNewsList();
                }
            } catch (error) {
                console.log('No hay novedades existentes');
            }
        }

        function previewImage(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                
                // Validar tamaño (5MB max)
                if (file.size > 5 * 1024 * 1024) {
                    showAlert('La imagen no debe superar los 5MB', 'error');
                    input.value = '';
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    currentImageBase64 = e.target.result;
                    const preview = document.getElementById('imagePreview');
                    const label = document.getElementById('fileLabel');
                    
                    preview.src = currentImageBase64;
                    preview.style.display = 'block';
                    label.classList.add('has-image');
                    label.innerHTML = '<i class="fa fa-check text-green-400 text-2xl"></i> Imagen seleccionada';
                };
                reader.readAsDataURL(file);
            }
        }

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        async function saveNews(e) {
            e.preventDefault();

            if (!currentImageBase64) {
                showAlert('Debes seleccionar una imagen', 'error');
                return;
            }

            const newNews = {
                id: Date.now(),
                titulo: document.getElementById('titulo').value,
                nombre: document.getElementById('nombre').value,
                descripcion: document.getElementById('descripcion').value,
                imagen: currentImageBase64,
                enlace: document.getElementById('enlace').value,
                boton: document.getElementById('boton').value || 'OBTENER',
                fecha: document.getElementById('fecha').value
            };

            // Agregar al inicio del array
            newsData.unshift(newNews);

            // Guardar en JSON
            try {
                // Crear blob con el JSON
                const blob = new Blob([JSON.stringify({ novedades: newsData }, null, 2)], { type: 'application/json' });
                
                // Crear link de descarga
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'novedades.json';
                a.click();
                URL.revokeObjectURL(url);

                showAlert('¡Novedad guardada! Se descargará el archivo JSON', 'success');
                
                // Reset form
                document.getElementById('newsForm').reset();
                document.getElementById('imagePreview').style.display = 'none';
                document.getElementById('fileLabel').classList.remove('has-image');
                document.getElementById('fileLabel').innerHTML = `
                    <i class="fa fa-cloud-upload text-4xl mb-2 block"></i>
                    <span>Arrastra una imagen o haz clic para seleccionar</span>
                    <br>
                    <small class="text-gray-500">Formatos: JPG, PNG, WEBP (Max 5MB)</small>
                `;
                currentImageBase64 = '';

                // Recargar lista
                setTimeout(() => loadExistingNews(), 1000);
                
            } catch (error) {
                showAlert('Error al guardar: ' + error.message, 'error');
            }
        }

        function renderNewsList() {
            const container = document.getElementById('newsItems');
            
            if (newsData.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-8">No hay novedades creadas</p>';
                return;
            }

            container.innerHTML = newsData.map(news => `
                <div class="news-item">
                    <img src="${news.imagen}" alt="${news.nombre}">
                    <div class="news-item-info">
                        <div class="news-item-title">${news.titulo} - ${news.nombre}</div>
                        <div class="news-item-date">${formatDate(news.fecha)}</div>
                    </div>
                    <button class="btn-delete" onclick="deleteNews(${news.id})">
                        <i class="fa fa-trash"></i> Eliminar
                    </button>
                </div>
            `).join('');
        }

        function deleteNews(id) {
            if (confirm('¿Estás seguro de eliminar esta novedad?')) {
                newsData = newsData.filter(n => n.id !== id);
                
                // Actualizar JSON
                const blob = new Blob([JSON.stringify({ novedades: newsData }, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'novedades.json';
                a.click();
                URL.revokeObjectURL(url);
                
                renderNewsList();
                showAlert('Novedad eliminada', 'success');
            }
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('es-ES', options);
        }

        // Event listeners
        document.getElementById('newsForm').addEventListener('submit', saveNews);
        
        // Set today's date as default
        document.getElementById('fecha').valueAsDate = new Date();

        // Init
        loadExistingNews();
    </script>
</body>
</html>
