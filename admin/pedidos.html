<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05050c">
<title>GMH Admin — Pedidos de Juegos</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap');
:root{--neon-blue:#00f0ff;--neon-purple:#bd00ff;--neon-green:#00ff94;--neon-orange:#ff9500;--neon-red:#ff0055;--glass:rgba(10,12,22,0.7)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Rajdhani',sans-serif;background:linear-gradient(180deg,#05050c 0%,#0a0c16 100%);color:#fff;margin:0;min-height:100vh}
.font-neon{font-family:'Orbitron',sans-serif}
header{position:sticky;top:0;z-index:50;background:rgba(5,6,14,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,240,255,0.15);padding:14px 16px}
.header-in{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:1.1rem;margin:0;color:var(--neon-blue);text-shadow:0 0 10px rgba(0,240,255,0.5)}
.spacer{flex:1}
.link-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(0,240,255,0.1);border:1px solid rgba(0,240,255,0.4);color:var(--neon-blue);border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px;text-decoration:none;cursor:pointer;transition:all 0.2s;font-family:'Rajdhani',sans-serif}
.link-btn:hover{background:rgba(0,240,255,0.2)}
main{max-width:900px;margin:0 auto;padding:16px 12px 60px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--glass);border:1px solid rgba(0,240,255,0.15);border-radius:12px;padding:12px;text-align:center}
.stat-num{font-family:'Orbitron',sans-serif;font-size:1.4rem;font-weight:900}
.stat-label{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:#9ca3af;font-weight:700}
.stat.total .stat-num{color:var(--neon-blue)}
.stat.pend .stat-num{color:var(--neon-orange)}
.stat.ok .stat-num{color:var(--neon-green)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:8px 16px;background:rgba(0,0,0,0.4);border:1px solid rgba(0,240,255,0.25);border-radius:999px;color:#9ca3af;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.2s;text-transform:uppercase;font-family:'Rajdhani',sans-serif}
.chip.active{background:rgba(0,240,255,0.15);border-color:var(--neon-blue);color:var(--neon-blue)}
.pedido{background:var(--glass);border:1px solid rgba(0,240,255,0.15);border-left:4px solid var(--neon-orange);border-radius:12px;padding:14px;margin-bottom:12px}
.pedido.completado{border-left-color:var(--neon-green);opacity:0.75}
.pedido-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.pedido-juego{font-family:'Orbitron',sans-serif;font-weight:800;font-size:1rem;color:#fff;flex:1;min-width:0;word-break:break-word}
.badge{display:inline-flex;padding:4px 10px;border-radius:999px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.05em}
.badge-plat{color:var(--neon-blue);border:1px solid rgba(0,240,255,0.4);background:rgba(0,240,255,0.08)}
.badge-pend{color:var(--neon-orange);border:1px solid rgba(255,149,0,0.5);background:rgba(255,149,0,0.1)}
.badge-ok{color:var(--neon-green);border:1px solid rgba(0,255,148,0.5);background:rgba(0,255,148,0.1)}
.pedido-detalles{color:#c4c9d4;font-size:0.85rem;line-height:1.4;margin:6px 0;background:rgba(255,255,255,0.04);border-radius:8px;padding:8px}
.pedido-meta{font-size:0.72rem;color:#8b93a7;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pedido-actions{display:flex;gap:8px}
.act{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:9px;font-weight:800;font-size:12px;font-family:'Orbitron',sans-serif;cursor:pointer;transition:all 0.2s;border:1px solid}
.act.ok{background:rgba(0,255,148,0.1);border-color:rgba(0,255,148,0.5);color:var(--neon-green)}
.act.ok:hover{background:rgba(0,255,148,0.2)}
.act.del{background:rgba(255,0,85,0.1);border-color:rgba(255,0,85,0.5);color:var(--neon-red)}
.act.del:hover{background:rgba(255,0,85,0.2)}
.empty{text-align:center;color:#6b7280;padding:40px 0}
.empty i{font-size:40px;opacity:0.5;display:block;margin-bottom:10px}
</style>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body>

<header>
    <div class="header-in">
        <h1 class="font-neon">🎮 PEDIDOS DE JUEGOS</h1>
        <div class="spacer"></div>
        <a href="index_admin.html" class="link-btn"><i class="fa fa-cog"></i> Admin</a>
        <a href="../index.html" class="link-btn"><i class="fa fa-home"></i> Sitio</a>
    </div>
</header>

<main>
    <div class="stats">
        <div class="stat total"><div class="stat-num" id="stat-total">0</div><div class="stat-label">Totales</div></div>
        <div class="stat pend"><div class="stat-num" id="stat-pend">0</div><div class="stat-label">Pendientes</div></div>
        <div class="stat ok"><div class="stat-num" id="stat-ok">0</div><div class="stat-label">Completados</div></div>
    </div>

    <div class="chips" id="chips">
        <button class="chip active" data-f="pendientes">⏳ Pendientes</button>
        <button class="chip" data-f="completados">✅ Completados</button>
        <button class="chip" data-f="todos">📦 Todos</button>
    </div>

    <div id="pedidos-list">
        <div class="empty"><i class="fa fa-spinner fa-spin"></i>Cargando pedidos...</div>
    </div>
</main>

<script>
const firebaseConfig={apiKey:"AIzaSyAd6_jbAZjMQlocFOkQPzIQ11NEGFfudcw",authDomain:"base-administrativa-dea20.firebaseapp.com",projectId:"base-administrativa-dea20",storageBucket:"base-administrativa-dea20.firebasestorage.app",messagingSenderId:"592943708135",appId:"1:592943708135:web:117c98bf2d947e19bf2f42"};
firebase.initializeApp(firebaseConfig);
const dbFirestore=firebase.firestore();

const CONSOLE_NAMES={'android':'Android','windows':'Windows','psvita':'PS Vita','psp':'PSP','ps1':'PS1','ps2':'PS2','ps3':'PS3','ps4':'PS4','nes':'NES','snes':'SNES','n64':'N64','gamecube':'GameCube','wii':'Wii','wiiu':'Wii U','gameboy':'Game Boy','gameboycolor':'GB Color','gameboyadvance':'GBA','nds':'NDS','3ds':'3DS','xbox':'Xbox','xbox360':'Xbox 360','segagenesis':'Sega Genesis','segasaturn':'Sega Saturn','sega_dreamcast':'Dreamcast','mame':'MAME','arcade_y_mas':'Arcade'};

let pedidosData=[];
let filtro='pendientes';

function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}
function getConsoleName(k){return CONSOLE_NAMES[k]||String(k||'—').toUpperCase()}
function formatDate(t){if(!t)return '—';const d=new Date(t);if(isNaN(d))return '—';return d.toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}

// Carga en tiempo real
dbFirestore.collection('pedidos').onSnapshot(snap=>{
    pedidosData=[];
    snap.forEach(doc=>pedidosData.push({id:doc.id,...doc.data()}));
    pedidosData.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
    render();
},err=>{
    console.error('Error pedidos:',err);
    document.getElementById('pedidos-list').innerHTML='<div class="empty"><i class="fa fa-exclamation-circle"></i>Error al cargar pedidos</div>';
});

function render(){
    const total=pedidosData.length;
    const pend=pedidosData.filter(p=>p.estado!=='completado').length;
    const ok=total-pend;
    document.getElementById('stat-total').textContent=total;
    document.getElementById('stat-pend').textContent=pend;
    document.getElementById('stat-ok').textContent=ok;

    let list=pedidosData;
    if(filtro==='pendientes')list=pedidosData.filter(p=>p.estado!=='completado');
    if(filtro==='completados')list=pedidosData.filter(p=>p.estado==='completado');

    const c=document.getElementById('pedidos-list');
    if(list.length===0){c.innerHTML='<div class="empty"><i class="fa fa-inbox"></i>No hay pedidos en esta vista</div>';return}

    c.innerHTML=list.map(p=>{
        const completado=p.estado==='completado';
        return `<div class="pedido ${completado?'completado':''}">
            <div class="pedido-top">
                <div class="pedido-juego">${escapeHtml(p.juego||'Sin nombre')}</div>
                <span class="badge badge-plat">${escapeHtml(getConsoleName(p.plataforma))}</span>
                <span class="badge ${completado?'badge-ok':'badge-pend'}">${completado?'Completado':'Pendiente'}</span>
            </div>
            ${p.detalles?`<div class="pedido-detalles">📝 ${escapeHtml(p.detalles)}</div>`:''}
            <div class="pedido-meta">
                <span>👤 ${escapeHtml(p.usuarioId||'anon')}</span>
                <span>🕐 ${formatDate(p.timestamp)}</span>
            </div>
            <div class="pedido-actions">
                ${completado?'':`<button class="act ok" onclick="completarPedido('${p.id}')"><i class="fa fa-check"></i> Completar</button>`}
                <button class="act del" onclick="eliminarPedido('${p.id}')"><i class="fa fa-trash"></i> Eliminar</button>
            </div>
        </div>`;
    }).join('');
}

// Filtros
document.getElementById('chips').addEventListener('click',e=>{
    const b=e.target.closest('.chip');
    if(!b)return;
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    filtro=b.dataset.f;
    render();
});

// Acciones
window.completarPedido=async function(id){
    try{
        await dbFirestore.collection('pedidos').doc(id).update({estado:'completado'});
    }catch(e){console.error('Error completar:',e);alert('Error al completar el pedido')}
};

window.eliminarPedido=async function(id){
    if(!confirm('¿Eliminar este pedido definitivamente?'))return;
    try{
        await dbFirestore.collection('pedidos').doc(id).delete();
    }catch(e){console.error('Error eliminar:',e);alert('Error al eliminar el pedido')}
};
</script>
</body>
</html>
