<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GamerModHub - Novedades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap');

        :root {
            --neon-green: #00ff94;
            --neon-blue: #00f0ff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #000;
            color: #fff;
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .font-neon { font-family: 'Orbitron', sans-serif; }

        /* Carrusel Container */
        .news-carousel {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .news-track {
            display: flex;
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            height: 100%;
            touch-action: pan-y pinch-zoom;
        }

        .news-slide {
            min-width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: flex-end;
            padding: 20px;
            background-size: cover;
            background-position: center;
        }

        .news-slide::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, 
                rgba(0,0,0,0.2) 0%, 
                rgba(0,0,0,0.6) 50%, 
                rgba(0,0,0,0.9) 100%);
        }

        .news-content {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 600px;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .news-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--neon-green);
            color: #000;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 12px;
            margin-bottom: 12px;
            box-shadow: 0 0 20px rgba(0, 255, 148, 0.4);
        }

        .news-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            line-height: 1.2;
        }

        .news-desc {
            font-size: 16px;
            color: #d1d5db;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .news-date {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-obtener {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--neon-green);
            color: #000;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 255, 148, 0.3);
            border: none;
            cursor: pointer;
        }

        .btn-obtener:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 255, 148, 0.5);
        }

        /* Indicadores (Dots) */
        .news-dots {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 20;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dot.active {
            background: var(--neon-green);
            width: 30px;
            border-radius: 5px;
        }

        /* Botones de navegación */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            transition: all 0.3s ease;
            font-size: 20px;
        }

        .nav-arrow:hover {
            background: var(--neon-green);
            color: #000;
        }

        .nav-arrow.prev { left: 20px; }
        .nav-arrow.next { right: 20px; }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 16px 20px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 255, 148, 0.2);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 18px;
            color: var(--neon-green);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn {
            color: var(--neon-green);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
        }

        /* Loading */
        .loading {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            flex-direction: column;
            gap: 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 255, 148, 0.2);
            border-top-color: var(--neon-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .news-title { font-size: 22px; }
            .news-desc { font-size: 14px; }
            .nav-arrow { display: none; }
        }
    </style>
</head>
<body>

    <!-- Loading -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p class="text-gray-400">Cargando novedades...</p>
    </div>

    <!-- Header -->
    <div class="header">
        <a href="../index.html" class="logo">
            <i class="fa fa-bolt"></i> GAMERMODHUB
        </a>
        <a href="crear_novedad.html" class="back-btn" title="Admin">
            <i class="fa fa-cog"></i>
        </a>
    </div>

    <!-- Carrusel -->
    <div class="news-carousel" id="carousel">
        <div class="news-track" id="track"></div>
        
        <!-- Flechas de navegación -->
        <div class="nav-arrow prev" onclick="changeSlide(-1)">
            <i class="fa fa-chevron-left"></i>
        </div>
        <div class="nav-arrow next" onclick="changeSlide(1)">
            <i class="fa fa-chevron-right"></i>
        </div>

        <!-- Indicadores -->
        <div class="news-dots" id="dots"></div>
    </div>

    <script>
        let newsData = [];
        let currentSlide = 0;
        let touchStartX = 0;
        let touchEndX = 0;

        // Cargar novedades
        async function loadNews() {
            try {
                const response = await fetch('novedades.json');
                if (!response.ok) throw new Error('No se pudo cargar');
                const data = await response.json();
                newsData = data.novedades || [];
                renderNews();
                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading').innerHTML = `
                    <p class="text-red-500">Error al cargar novedades</p>
                    <a href="crear_novedad.html" class="btn-obtener mt-4">Crear primera novedad</a>
                `;
            }
        }

        function renderNews() {
            const track = document.getElementById('track');
            const dotsContainer = document.getElementById('dots');
            
            if (newsData.length === 0) {
                track.innerHTML = `
                    <div class="news-slide" style="background: linear-gradient(135deg, #1a1a2e, #16213e);">
                        <div class="news-content text-center">
                            <h2 class="news-title">No hay novedades</h2>
                            <p class="news-desc">Aún no se han creado novedades</p>
                            <a href="crear_novedad.html" class="btn-obtener">
                                <i class="fa fa-plus"></i> Crear novedad
                            </a>
                        </div>
                    </div>
                `;
                return;
            }

            // Renderizar slides
            track.innerHTML = newsData.map((news, index) => `
                <div class="news-slide" style="background-image: url('${news.imagen || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600"><rect fill="%231a1a2e" width="1200" height="600"/></svg>');">
                    <div class="news-content">
                        <div class="news-badge">
                            <i class="fa fa-circle"></i> ${news.titulo || 'NUEVO'}
                        </div>
                        <h2 class="news-title">${news.nombre || 'Sin título'}</h2>
                        <p class="news-desc">${news.descripcion || ''}</p>
                        <div class="news-date">
                            <i class="fa fa-calendar"></i> ${formatDate(news.fecha)}
                        </div>
                        ${news.enlace ? `<a href="${news.enlace}" target="_blank" class="btn-obtener">
                            <i class="fa fa-download"></i> ${news.boton || 'OBTENER'}
                        </a>` : ''}
                    </div>
                </div>
            `).join('');

            // Renderizar dots
            dotsContainer.innerHTML = newsData.map((_, index) => `
                <div class="dot ${index === 0 ? 'active' : ''}" onclick="goToSlide(${index})"></div>
            `).join('');

            // Touch events para swipe
            setupTouchEvents();
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('es-ES', options);
        }

        function changeSlide(direction) {
            if (newsData.length === 0) return;
            currentSlide = (currentSlide + direction + newsData.length) % newsData.length;
            updateSlide();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateSlide();
        }

        function updateSlide() {
            const track = document.getElementById('track');
            const dots = document.querySelectorAll('.dot');
            
            track.style.transform = `translateX(-${currentSlide * 100}%)`;
            
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentSlide);
            });
        }

        function setupTouchEvents() {
            const carousel = document.getElementById('carousel');
            
            carousel.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            carousel.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });
        }

        function handleSwipe() {
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;
            
            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0) {
                    changeSlide(1); // Swipe left -> next
                } else {
                    changeSlide(-1); // Swipe right -> prev
                }
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') changeSlide(-1);
            if (e.key === 'ArrowRight') changeSlide(1);
        });

        // Auto-play (opcional)
        let autoPlayInterval;
        function startAutoPlay() {
            autoPlayInterval = setInterval(() => {
                changeSlide(1);
            }, 8000); // Cambiar cada 8 segundos
        }

        function stopAutoPlay() {
            clearInterval(autoPlayInterval);
        }

        // Iniciar
        loadNews();
        startAutoPlay();

        // Pausar autoplay al interactuar
        document.getElementById('carousel').addEventListener('mouseenter', stopAutoPlay);
        document.getElementById('carousel').addEventListener('mouseleave', startAutoPlay);
    </script>
</body>
</html>
